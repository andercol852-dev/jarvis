<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Micrófono Infinito</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        header { text-align: center; margin-top: 10px; }
        h1 { font-size: 2rem; letter-spacing: 4px; text-shadow: 0 0 12px #00ffcc; color: #ffffff; }
        
        #status {
            font-size: 0.9rem;
            color: #00ffcc;
            margin-top: 5px;
            font-weight: bold;
            background: rgba(0, 255, 204, 0.1);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid #00ffcc;
        }

        /* ANIMACIÓN DEL NÚCLEO */
        .jarvis-viewport {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .outer-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px dashed #00aaff;
            border-radius: 50%;
            animation: girar 10s linear infinite;
        }

        .jarvis-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,204,1) 0%, rgba(0,100,200,0.6) 60%, transparent 100%);
            box-shadow: 0 0 30px #00ffcc, inset 0 0 20px #00ffcc;
            border: 2px solid #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .jarvis-core.speaking {
            animation: pulsoVoz 0.35s infinite alternate ease-in-out;
            box-shadow: 0 0 70px #00ffcc, 0 0 110px #00aaff, inset 0 0 40px #ffffff;
        }

        @keyframes girar { 100% { transform: rotate(360deg); } }
        @keyframes pulsoVoz {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.4); filter: brightness(2); }
        }

        .controls { display: flex; gap: 10px; width: 100%; max-width: 400px; }

        button {
            flex: 1;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 15px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active { background: #00ffcc; color: #050811; }

        #console-log {
            width: 100%; max-width: 400px; height: 120px;
            background: rgba(0, 0, 0, 0.8); border: 1px solid #004455;
            border-radius: 6px; padding: 10px; overflow-y: auto;
            font-family: monospace; font-size: 0.75rem; color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <div id="status">MICRÓFONO: APAGADO</div>
    </header>

    <div class="jarvis-viewport">
        <div class="outer-ring"></div>
        <div id="jarvisCore" class="jarvis-core"></div>
    </div>

    <div class="controls">
        <button onclick="conectarBluetooth()">1. Conectar BT</button>
        <button onclick="activarMicrofonoInfinito()">2. ENCENDER MICRÓFONO 24/7</button>
    </div>

    <div id="console-log">--- TOCA "ENCENDER MICRÓFONO" PARA INICIAR ---<br></div>

    <script>
        let rec;
        let microfonoForzado = false;
        let jarvisHablando = false;
        const coreElement = document.getElementById("jarvisCore");
        const statusElement = document.getElementById("status");

        const MEMORIA_JARVIS = {
            "hola": { resp: "Hola, estoy listo para recibir tus órdenes.", cmd: null },
            "como estas": { resp: "Todos mis sistemas están al cien por ciento.", cmd: null },
            "buenos dias": { resp: "Buenos días. Esperando instrucciones.", cmd: null },
            "quien eres": { resp: "Soy Jarvis, tu asistente autónomo.", cmd: null },
            "avanza": { resp: "Avanzando motores.", cmd: "F" },
            "detente": { resp: "Deteniendo motores inmediatamente.", cmd: "S" },
            "para": { resp: "Deteniendo robot.", cmd: "S" },
            "ve al punto uno": { resp: "Iniciando ruta al punto uno.", cmd: "1" },
            "regresa a casa": { resp: "Regresando a la base inicial.", cmd: "H" },
            "vuelve a casa": { resp: "Iniciando retorno a casa.", cmd: "H" }
        };

        function log(texto) {
            const consoleDiv = document.getElementById("console-log");
            consoleDiv.innerHTML += "> " + texto + "<br>";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function hablar(texto) {
            log("Jarvis: " + texto);
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';

            utterance.onstart = () => {
                jarvisHablando = true;
                coreElement.classList.add("speaking");
            };

            utterance.onend = () => {
                coreElement.classList.remove("speaking");
                jarvisHablando = false;
                // Al terminar de hablar, fuerza el reinicio instantáneo del micrófono
                forzarEncendidoMicrofono();
            };

            window.speechSynthesis.speak(utterance);
        }

        // BUCLE DE FUERZA BRUTA PARA EL MICRÓFONO
        function forzarEncendidoMicrofono() {
            if (!microfonoForzado || jarvisHablando) return;
            try {
                rec.start();
            } catch (e) {
                // Si ya está encendido, ignora el error y continúa
            }
        }

        function activarMicrofonoInfinito() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Navegador no compatible. Usa Google Chrome en Android.");
                return;
            }

            rec = new SpeechRecognition();
            rec.lang = 'es-ES';
            rec.continuous = true;
            rec.interimResults = false;

            microfonoForzado = true;

            rec.onstart = () => {
                statusElement.innerText = "MICRÓFONO: SIEMPRE ACTIVO 🔴";
                statusElement.style.color = "#00ffcc";
            };

            // SI ANDROID LO APAGA, LO REENCENDEMOS DE INMEDIATO (0 MILISEGUNDOS)
            rec.onend = () => {
                if (microfonoForzado && !jarvisHablando) {
                    forzarEncendidoMicrofono();
                }
            };

            rec.onerror = (e) => {
                if (microfonoForzado && !jarvisHablando) {
                    setTimeout(forzarEncendidoMicrofono, 100);
                }
            };

            rec.onresult = (event) => {
                const fraseEscuchada = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                log("Escuchado: " + fraseEscuchada);

                if (fraseEscuchada.includes("jarvis")) {
                    let ordenLimpia = fraseEscuchada.replace("oye jarvis", "").replace("jarvis", "").trim();
                    let encontrado = false;

                    for (let clave in MEMORIA_JARVIS) {
                        if (ordenLimpia.includes(clave)) {
                            hablar(MEMORIA_JARVIS[clave].resp);
                            enviarComandoRobot(MEMORIA_JARVIS[clave].cmd);
                            encontrado = true;
                            break;
                        }
                    }

                    if (!encontrado) {
                        hablar("No tengo esa pregunta o instrucción guardada.");
                    }
                }
            };

            forzarEncendidoMicrofono();
            
            // RELOJ GUARDIÁN: Revisa cada 1 segundo que el micrófono no se haya dormido
            setInterval(() => {
                if (microfonoForzado && !jarvisHablando) {
                    forzarEncendidoMicrofono();
                }
            }, 1000);
        }

        async function conectarBluetooth() {
            try {
                log("Buscando Bluetooth...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
                });
                await device.gatt.connect();
                log("Conectado a " + device.name);
                hablar("Bluetooth conectado.");
            } catch (error) {
                log("Error BT: " + error);
            }
        }

        function enviarComandoRobot(cmd) {
            if (cmd) log("ENVIADO A ROBOT: [" + cmd + "]");
        }
    </script>
</body>
</html>
