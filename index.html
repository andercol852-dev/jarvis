<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Sistema de Control por Voz</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        header { text-align: center; margin-top: 10px; }
        h1 { font-size: 2rem; letter-spacing: 4px; text-shadow: 0 0 12px #00ffcc; color: #ffffff; }
        
        #status {
            font-size: 0.9rem;
            color: #ff3366;
            margin-top: 5px;
            font-weight: bold;
            background: rgba(255, 51, 102, 0.1);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid #ff3366;
            transition: all 0.3s ease;
        }

        /* ANIMACIÓN DEL NÚCLEO JARVIS */
        .jarvis-viewport {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .outer-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px dashed #00aaff;
            border-radius: 50%;
            animation: girar 10s linear infinite;
        }

        .jarvis-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,204,1) 0%, rgba(0,100,200,0.6) 60%, transparent 100%);
            box-shadow: 0 0 30px #00ffcc, inset 0 0 20px #00ffcc;
            border: 2px solid #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .jarvis-core.speaking {
            animation: pulsoVoz 0.35s infinite alternate ease-in-out;
            box-shadow: 0 0 70px #00ffcc, 0 0 110px #00aaff, inset 0 0 40px #ffffff;
        }

        @keyframes girar { 100% { transform: rotate(360deg); } }
        @keyframes pulsoVoz {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.4); filter: brightness(2); }
        }

        .controls { display: flex; gap: 10px; width: 100%; max-width: 400px; }

        button {
            flex: 1;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 15px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active { background: #00ffcc; color: #050811; }

        #console-log {
            width: 100%; max-width: 400px; height: 130px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid #004455;
            border-radius: 6px; padding: 10px; overflow-y: auto;
            font-family: monospace; font-size: 0.75rem; color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <div id="status">MICRÓFONO: APAGADO</div>
    </header>

    <div class="jarvis-viewport">
        <div class="outer-ring"></div>
        <div id="jarvisCore" class="jarvis-core"></div>
    </div>

    <div class="controls">
        <button onclick="conectarBluetooth()">1. Conectar BT</button>
        <button onclick="activarMicrofonoInfinito()">2. ENCENDER MICRÓFONO 24/7</button>
    </div>

    <br>
    <div id="console-log">--- TOCA "ENCENDER MICRÓFONO 24/7" PARA INICIAR ---<br></div>

    <script>
        let rec;
        let microfonoForzado = false;
        let jarvisHablando = false;
        const coreElement = document.getElementById("jarvisCore");
        const statusElement = document.getElementById("status");

        // DICCIONARIO DE CONVERSACIÓN Y COMANDOS DEL ROBOT
        const MEMORIA_JARVIS = {
            "hola": { resp: "Hola, estoy listo para recibir tus órdenes.", cmd: null },
            "como estas": { resp: "Todos mis sistemas están funcionando al cien por ciento.", cmd: null },
            "que tal": { resp: "Todo en orden por aquí, esperando instrucciones.", cmd: null },
            "buenos dias": { resp: "Buenos días. Esperando instrucciones de navegación.", cmd: null },
            "buenas noches": { resp: "Buenas noches. Sistemas listos.", cmd: null },
            "quien eres": { resp: "Soy Jarvis, tu asistente robótico autónomo.", cmd: null },
            "quien sos": { resp: "Soy Jarvis, tu asistente robótico autónomo.", cmd: null },
            "donde estas": { resp: "Me encuentro montado en el chasis del robot.", cmd: null },
            "avanza": { resp: "Avanzando motores.", cmd: "F" },
            "detente": { resp: "Deteniendo motores inmediatamente.", cmd: "S" },
            "para": { resp: "Deteniendo robot.", cmd: "S" },
            "ve al punto uno": { resp: "Iniciando rutina de navegación al punto uno.", cmd: "1" },
            "regresa a casa": { resp: "Calculando retorno. Regresando a la base inicial.", cmd: "H" },
            "vuelve a casa": { resp: "Iniciando retorno a casa.", cmd: "H" }
        };

        function log(texto) {
            const consoleDiv = document.getElementById("console-log");
            consoleDiv.innerHTML += "> " + texto + "<br>";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // SÍNTESIS DE VOZ CONTROLADA
        function hablar(texto) {
            log("Jarvis: '" + texto + "'");
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;

            utterance.onstart = () => {
                jarvisHablando = true;
                if (coreElement) coreElement.classList.add("speaking");
            };

            utterance.onend = () => {
                if (coreElement) coreElement.classList.remove("speaking");
                jarvisHablando = false;
                // Reenviar la escucha inmediatamente tras hablar
                forzarEncendidoMicrofono();
            };

            window.speechSynthesis.speak(utterance);
        }

        // FUNCIÓN QUE OBLIGA AL MICRÓFONO A MANTENERSE ENCEDIDO
        function forzarEncendidoMicrofono() {
            if (!microfonoForzado || jarvisHablando) return;
            try {
                rec.start();
            } catch (e) {
                // Si ya estaba activo, la excepción se ignora silenciosamente
            }
        }

        // INICIALIZACIÓN DEL MICRÓFONO PERMANENTE
        function activarMicrofonoInfinito() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Navegador no compatible. Abre este sitio en Google Chrome en Android.");
                return;
            }

            rec = new SpeechRecognition();
            rec.lang = 'es-ES';
            rec.continuous = true;
            rec.interimResults = false;

            microfonoForzado = true;

            rec.onstart = () => {
                if (statusElement) {
                    statusElement.innerText = "MICRÓFONO: SIEMPRE ACTIVO 🔴";
                    statusElement.style.color = "#00ffcc";
                    statusElement.style.borderColor = "#00ffcc";
                    statusElement.style.background = "rgba(0, 255, 204, 0.1)";
                }
            };

            // RECONEXIÓN AUTOMÁTICA SI ANDROID CIERRA LA ESCUCHA
            rec.onend = () => {
                if (microfonoForzado && !jarvisHablando) {
                    forzarEncendidoMicrofono();
                }
            };

            rec.onerror = (e) => {
                if (microfonoForzado && !jarvisHablando) {
                    setTimeout(forzarEncendidoMicrofono, 100);
                }
            };

            // EVALUACIÓN FLEXIBLE DE FRASE
            rec.onresult = (event) => {
                const fraseEscuchada = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                log("Oído: '" + fraseEscuchada + "'");

                if (fraseEscuchada.includes("jarvis")) {
                    let comandoEncontrado = false;

                    // Buscar coincidencias directas en las claves del diccionario
                    for (let clave in MEMORIA_JARVIS) {
                        if (fraseEscuchada.includes(clave)) {
                            hablar(MEMORIA_JARVIS[clave].resp);
                            enviarComandoRobot(MEMORIA_JARVIS[clave].cmd);
                            comandoEncontrado = true;
                            break;
                        }
                    }

                    // Respuesta cuando solo se pronuncia "Jarvis" o una frase no indexada
                    if (!comandoEncontrado) {
                        let textoSinJarvis = fraseEscuchada.replace("oye jarvis", "").replace("jarvis", "").trim();
                        
                        if (textoSinJarvis === "") {
                            hablar("¿Sí? Estoy escuchando tus órdenes.");
                        } else {
                            hablar("No tengo esa pregunta o instrucción guardada en mi código.");
                        }
                    }
                }
            };

            forzarEncendidoMicrofono();
            
            // RELOJ GUARDIÁN DE RESPALDO (Revisa la salud del micrófono cada 1 segundo)
            setInterval(() => {
                if (microfonoForzado && !jarvisHablando) {
                    forzarEncendidoMicrofono();
                }
            }, 1000);
        }

        // CONEXIÓN BLUETOOTH CON LA PLACA MEGAPII / HC-05
        async function conectarBluetooth() {
            try {
                log("Buscando módulos Bluetooth...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
                });
                log("Conectando a GATT Server...");
                await device.gatt.connect();
                log("¡Conectado a " + device.name + "!");
                hablar("Bluetooth conectado exitosamente.");
            } catch (error) {
                log("Error al conectar BT: " + error);
            }
        }

        function enviarComandoRobot(cmd) {
            if (cmd) log("ENVIADO A ROBOT: [" + cmd + "]");
        }
    </script>
</body>
</html>
